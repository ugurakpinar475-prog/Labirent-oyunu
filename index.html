<style>
:root{--bg1:#0f0d45;--bg2:#5a1c8c;--card:#fffaf0;--ink:#3a2a7a;--accent:#ffb703;--wall:#5b3fd1;--floor:#fff6e0;--btn:#ff6b9d;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#32258a;--bg2:#7d2b63;--card:#2a2152;--ink:#f4ecff;--wall:#a893ff;--floor:#2d2560}}
:root[data-theme="dark"]{--bg1:#32258a;--bg2:#7d2b63;--card:#2a2152;--ink:#f4ecff;--wall:#a893ff;--floor:#2d2560}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;-webkit-touch-callout:none}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.b{position:fixed;bottom:0;border-radius:50%;background:#fff;opacity:.22;animation:fl linear infinite;pointer-events:none}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-120vh)}}
@media (prefers-reduced-motion:reduce){.b{animation:none;bottom:auto}}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px)}
.screen.on{display:flex}
h1{font-size:clamp(34px,9vw,52px);margin:0;color:#fff;text-align:center;text-shadow:0 4px 0 rgba(58,42,122,.35);line-height:1.05}
.btn{font:inherit;font-weight:800;font-size:22px;border:1px solid rgba(255,255,255,.4);border-radius:22px;padding:14px 30px;background:linear-gradient(135deg,#ff3d9a,#7c4dff);color:#fff;box-shadow:0 0 16px rgba(255,61,154,.45),inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 rgba(0,0,0,.25);cursor:pointer;min-width:200px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.alt{background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(0,229,255,.55);box-shadow:0 0 14px rgba(0,229,255,.3),inset 0 1px 0 rgba(255,255,255,.3),0 4px 0 rgba(0,0,0,.2)}
.btn.sm{font-size:16px;padding:8px 16px;min-width:0;border-radius:16px}
.menu{justify-content:safe center;gap:18px;overflow-y:auto;touch-action:pan-y}
.mascot{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#ff9f1c);position:relative;box-shadow:0 8px 0 rgba(0,0,0,.18);animation:bob 1.6s ease-in-out infinite}
.mascot::before,.mascot::after{content:"";position:absolute;top:34px;width:16px;height:20px;border-radius:50%;background:#fff;box-shadow:inset -4px 0 0 #3a2a7a}
.mascot::before{left:24px}.mascot::after{right:24px}
@keyframes bob{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
.top{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;font-weight:800;font-size:18px}
.top .btn,.lvw,#lvl{white-space:nowrap}.top .btn.sm{padding:8px 12px}.top>span:last-child{display:flex;gap:6px}
.coins{background:rgba(0,0,0,.25);padding:6px 12px;border-radius:14px}
.grid{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px;overflow:auto;touch-action:pan-y;padding-bottom:10px}
#wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;margin:10px 0}
canvas{border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.2);touch-action:none}
.hint{color:#fff;font-weight:700;text-align:center;min-height:22px}
.ov{position:fixed;inset:0;background:rgba(30,15,70,.6);display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.card{background:rgba(44,30,120,.58);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border:1px solid rgba(255,255,255,.28);box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 28px rgba(124,77,255,.35),inset 0 1px 0 rgba(255,255,255,.35);color:#fff;border-radius:28px;padding:24px;width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.card h2{margin:0;font-size:28px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:19px}
.seg{display:flex;gap:6px}
.seg button,.tg{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 14px;background:rgba(127,127,160,.25);color:var(--ink)}
.seg button.on,.tg.on{background:var(--btn);color:#fff}
.map{width:100%;max-width:520px;flex:1;min-height:0;overflow:auto;touch-action:pan-y;margin-top:10px;border-radius:22px;background:rgba(255,255,255,.12)}
.ch{position:relative;height:720px}.ch svg{position:absolute;inset:0;width:100%;height:100%}
.ban{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:800;color:#fff;font-size:17px;padding:0 8px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.cas{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:46px;line-height:1;display:flex;align-items:center;gap:4px}.cas span{font-size:30px}
.ch.fog{filter:blur(2px);opacity:.75}
.nd{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:0;font:inherit;font-weight:800;font-size:19px;background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.nd small{position:absolute;right:-12px;top:-14px;font-size:20px}
.nd.done{background:#80ed99;color:#14532d}.nd.cur{background:var(--accent);color:#3a2a7a;animation:pl 1s infinite alternate}.nd.lock{opacity:.6}
.nd.fire::after{content:'🔥';position:absolute;left:50%;top:-34px;margin-left:-14px;font-size:26px;animation:fr .45s infinite alternate}
@keyframes pl{to{transform:translate(-50%,-50%) scale(1.12)}}@keyframes fr{from{transform:scale(.9) rotate(-8deg)}to{transform:scale(1.25) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.nd.cur,.nd.fire::after{animation:none}}
.skins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.skins button{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:28px;border:0;border-radius:14px;padding:6px;background:rgba(127,127,160,.25)}.skins button.on{background:var(--btn)}.ov .card{max-height:92vh;overflow:auto;touch-action:pan-y}
#toast{pointer-events:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:#3a2a7a;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;display:none;max-width:86%;text-align:center}
canvas{box-shadow:0 10px 0 rgba(0,0,0,.2),0 0 0 6px rgba(255,255,255,.35)}
.tbar{width:100%;max-width:520px;height:22px;border-radius:12px;background:rgba(0,0,0,.28);position:relative;overflow:hidden;margin-top:8px}.tbar i{position:absolute;left:0;top:0;bottom:0;background:#80ed99;border-radius:12px;transition:background .3s}.tbar b{position:relative;display:block;text-align:center;color:#fff;font-size:13px;line-height:22px;text-shadow:0 1px 0 rgba(0,0,0,.4)}.tbar.low{animation:lw .5s infinite alternate}@keyframes lw{to{transform:scale(1.03)}}
.tools{display:flex;gap:10px;justify-content:center;margin-bottom:6px}.card .em{font-size:54px;line-height:1}
@media (prefers-reduced-motion:reduce){.tbar.low{animation:none}}

.lvw{display:flex;align-items:center;gap:8px}#cmp{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.3);border:2px solid #fff;position:relative;display:inline-block}#cmp i{position:absolute;inset:0}#cmp i::before{content:'';position:absolute;left:50%;top:2px;margin-left:-5px;border:5px solid transparent;border-bottom:12px solid #ff4d6d;border-top:0}#cmp i::after{content:'';position:absolute;left:50%;bottom:2px;margin-left:-4px;border:4px solid transparent;border-top:9px solid #fff;border-bottom:0}
.bl{position:absolute;transform:translateX(-50%);background:#fff;color:#3a2a7a;border-radius:14px;padding:4px 10px;font-weight:800;font-size:12px;line-height:1.2;max-width:80%;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
#tbb{position:absolute;top:0;transform:translateX(-50%);width:min(230px,100%);background:#fff;color:#3a2a7a;border-radius:22px;padding:10px 12px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;animation:pl2 1.4s ease-in-out infinite alternate}
#tbb::after{content:'';position:absolute;left:50%;bottom:-16px;width:13px;height:13px;border-radius:50%;background:#fff}#tbb::before{content:'';position:absolute;left:54%;bottom:-27px;width:8px;height:8px;border-radius:50%;background:#fff}#tbb small{display:block;font-size:12px;opacity:.65;margin-top:4px}
@keyframes pl2{to{margin-top:6px}}@media (prefers-reduced-motion:reduce){#tbb{animation:none}}
body.th .b{background:none;border-radius:0;font-size:28px;line-height:1;opacity:.35;display:flex;align-items:center;justify-content:center;overflow:hidden}
.nd em{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font-style:normal;font-size:11px;color:#ffd23f;text-shadow:0 1px 0 rgba(0,0,0,.6);white-space:nowrap}

.card .seg button,.card .tg,.skins button{color:#fff}.card .seg button.on,.card .tg.on{background:linear-gradient(135deg,#ff3d9a,#7c4dff);box-shadow:0 0 10px rgba(255,61,154,.5)}
.ov{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}.map{border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#mp{position:fixed;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none;pointer-events:none;display:block}
.menu{gap:14px}
.stage{perspective:800px;width:min(150px,19vh);height:min(150px,19vh);position:relative;margin-bottom:12px}
.logo3d{position:absolute;inset:0;transform-style:preserve-3d;animation:fl3 7s ease-in-out infinite}
.logo3d>*{position:absolute;inset:0;width:100%;height:100%}
.lg-glow{border-radius:30%;background:radial-gradient(circle,rgba(0,240,255,.6),rgba(255,77,225,0) 70%);filter:blur(14px);transform:translateZ(-40px) scale(1.3)}
.lg-plate{filter:drop-shadow(0 0 10px rgba(0,240,255,.65))}.lg-snake{transform:translateZ(34px);filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
@keyframes fl3{0%,100%{transform:rotateY(-18deg) rotateX(8deg) translateY(0)}50%{transform:rotateY(18deg) rotateX(-6deg) translateY(-12px)}}
.lg-shadow{position:absolute;left:15%;right:15%;bottom:-16px;height:14px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(7px);animation:shd 7s ease-in-out infinite}@keyframes shd{50%{transform:scale(.78);opacity:.5}}
.menu h1{background:linear-gradient(180deg,#fff 15%,#7df9ff 62%,#c39bff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(0,229,255,.55)) drop-shadow(0 3px 0 rgba(0,0,0,.35));font-weight:900;letter-spacing:.5px}
.mstars{display:flex;align-items:center;gap:6px;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,214,90,.55);box-shadow:0 0 14px rgba(255,214,90,.3),inset 0 1px 0 rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-weight:800;font-size:19px}
.pbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:min(300px,84vw);padding:15px 24px;font:inherit;font-weight:900;font-size:26px;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:linear-gradient(135deg,#ff3d9a,#7c4dff 60%,#00c8ff);box-shadow:0 0 24px rgba(255,61,154,.6),0 0 48px rgba(124,77,255,.35),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.2);cursor:pointer}
.pbtn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shn 3.6s ease-in-out infinite}@keyframes shn{60%,100%{left:130%}}
.pbtn:active{transform:translateY(2px) scale(.99)}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(340px,92vw)}
.gbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 4px;min-height:84px;font:inherit;font-weight:700;font-size:13px;line-height:1.15;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:20px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 14px rgba(0,229,255,.25),inset 0 1px 0 rgba(255,255,255,.35);cursor:pointer}
.gbtn svg{width:28px;height:28px;fill:none;stroke:#7df9ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(0,229,255,.8))}.gbtn:active{transform:translateY(2px)}
.lgp{padding:4px;gap:2px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lgp button{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:999px;padding:6px 14px;background:transparent;color:rgba(255,255,255,.75)}.lgp button.on{color:#fff;background:linear-gradient(135deg,#ff3d9a,#7c4dff);box-shadow:0 0 12px rgba(255,61,154,.6)}
@media (prefers-reduced-motion:reduce){.logo3d,.lg-shadow,.pbtn::after{animation:none}}
@media (max-height:640px){.stage{display:none}}
.card .row{flex-wrap:wrap}.card .row .seg{flex-wrap:wrap;justify-content:flex-end}.card .seg button{padding:7px 12px;font-size:15px}
.skins small{display:block;font-size:12px!important;font-weight:800;color:#ffd23f}
body:not(.th) .b{display:none}
@media (max-height:620px){.hint{display:none}#wrap{margin:4px 0}}@media (max-width:380px){.top{font-size:14px;gap:4px}.top .btn.sm{font-size:13px;padding:7px 9px}.lvw{gap:4px}}
@media (orientation:landscape) and (max-height:560px){
#game.on{display:grid;grid-template-columns:minmax(0,1fr) 210px;grid-template-rows:auto auto auto 1fr;gap:8px 14px;align-items:start}
#game #wrap{grid-column:1;grid-row:1/-1;margin:0;height:100%;min-height:0;min-width:0}
#game .top,#game .tbar,#game .hint,#game .tools{grid-column:2;width:100%}
#game .top{flex-wrap:wrap;justify-content:center;gap:6px}#game .tbar{margin-top:0}
#game .hint{display:block;font-size:13px;min-height:0}#game .tools{flex-wrap:wrap;margin:0}
.menu{padding-top:calc(env(safe-area-inset-top,0px) + 8px);gap:10px}.menu h1{font-size:30px}.pbtn{padding:9px 20px;font-size:22px}.gbtn{min-height:60px;padding:8px 4px}
.card{padding:14px;gap:8px}.card h2{font-size:22px}.card .em{font-size:36px}.skins{grid-template-columns:repeat(9,1fr)}.skins button{font-size:20px;padding:3px}
}
#gm{flex-wrap:wrap;justify-content:center;border-radius:20px}.gmd{color:#fff;opacity:.85;font-size:13px;font-weight:700;text-align:center;max-width:300px;min-height:16px}
</style>
</head>

</div></div>

  <h2 data-t="set"></h2>

/* karakter sprite'ı: emoji yazı tipi yığını + görünmeyen/tek renkli glifler için açık renkli rozet */
const SPR={},EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
function skinSpr(k){const dpr=Math.min(2,window.devicePixelRatio||1),z=Math.ceil(br*2.8),key=k+'|'+z+'|'+dpr;if(key in SPR)return SPR[key];
  const c=document.createElement('canvas');c.width=c.height=Math.ceil(z*dpr);const x=c.getContext('2d');x.scale(dpr,dpr);
  x.font=Math.round(br*2)+'px '+EF;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#ff00ff';x.fillText(k,z/2,z/2);

  if(n<20)return SPR[key]=null;
  x.clearRect(0,0,z,z);
  if(m/n>.85){const g=x.createRadialGradient(z/2,z/2,0,z/2,z/2,br*1.2);g.addColorStop(0,'#fff');g.addColorStop(1,'#d9d0ff');x.fillStyle=g;x.beginPath();x.arc(z/2,z/2,br*1.2,0,7);x.fill();x.fillStyle='#3a2a7a';x.font=Math.round(br*1.5)+'px '+EF}
  else{x.font=Math.round(br*2)+'px '+EF}
  x.fillText(k,z/2,z/2);return SPR[key]=c}
function draw(){
  const W=C*cs,H=R*cs;ctx.clearRect(0,0,W,H);
  ctx.drawImage(bg,0,0,W,H);

    ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='#ffd23f';ctx.lineWidth=cs*.12;ctx.setLineDash([1,cs*.26]);ctx.lineCap='round';ctx.beginPath();P.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.setLineDash([]);
    let cx=P[m][0],cy=P[m][1],j=m;const gs=[{x:cx,y:cy}];
    for(let k=1;k<10;k++){let need=br*.7;while(need>0&&j>0){const ax=P[j-1][0],ay=P[j-1][1],dd=Math.hypot(ax-cx,ay-cy);if(dd<=need){need-=dd;cx=ax;cy=ay;j--}else{cx+=(ax-cx)/dd*need;cy+=(ay-cy)/dd*need;need=0}}gs.push({x:cx,y:cy})}
    const pp=P[Math.max(0,m-1)];ctx.globalAlpha=al*.6;snake(ctx,gs,br,Math.atan2(P[m][1]-pp[1],P[m][0]-pp[0]));
    ctx.globalAlpha=al;ctx.font=cs*.4+'px serif';ctx.textAlign='center';ctx.fillText('✨',P[m][0],P[m][1]-br*1.7);ctx.restore()}
  const gx=(C-.5)*cs,gy=(R-.5)*cs,pu=1+Math.sin(Date.now()/250)*.1,gl=ctx.createRadialGradient(gx,gy,0,gx,gy,cs*.7);
  gl.addColorStop(0,'rgba(255,214,90,.8)');gl.addColorStop(1,'rgba(255,214,90,0)');ctx.fillStyle=gl;ctx.fillRect(gx-cs,gy-cs,cs*2,cs*2);
  ctx.save();ctx.globalAlpha=got<M.N?.4:1;ctx.translate(gx,gy);ctx.scale(pu,pu);ctx.font=cs*.6+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(GE,0,0);ctx.restore();if(got<M.N){ctx.font=Math.round(cs*.32)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔒',gx+cs*.2,gy+cs*.2)}
  items.forEach(it=>{const sp=skinSpr(it.t);if(!sp)return;const t=Date.now(),z=cs*.55*(1+Math.sin(t/260+it.x)*.1),px=(it.x+.5)*cs,py=(it.y+.5)*cs+Math.sin(t/300+it.y)*cs*.04,od=M.mt==='order'&&it.k>=0;ctx.save();if(od&&it.k!==got)ctx.globalAlpha=.45;ctx.drawImage(sp,px-z/2,py-z/2,z,z);
    if(od){ctx.font='bold '+Math.round(cs*.3)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='#3a2a7a';ctx.fillStyle='#fff';ctx.strokeText(it.k+1,px,py-cs*.34);ctx.fillText(it.k+1,px,py-cs*.34)}ctx.restore()});
  en.forEach(e=>{const sp=skinSpr(e.e);if(!sp)return;const z=cs*.8;ctx.drawImage(sp,e.x-z/2,e.y-z/2+Math.sin(Date.now()/180+e.cx)*cs*.04,z,z)});
  trail.forEach(q=>{ctx.globalAlpha=q.l/28;ctx.fillStyle='#ff6b9d';ctx.beginPath();ctx.arc(q.x,q.y,br*.5*q.l/14,0,7);ctx.fill()});ctx.globalAlpha=1;
  ctx.fillStyle='rgba(30,10,80,.3)';ctx.beginPath();ctx.ellipse(ball.x+2,ball.y+br*.8,br*.9,br*.4,0,0,7);ctx.fill();
  ctx.globalAlpha=inv>0&&((Date.now()/100)|0)%2?.35:1;const sp=(S.skin&&S.skin!=='snake')?skinSpr(S.skin):null;
  if(sp){const z=Math.ceil(br*2.8),w=Math.sin(Date.now()/150)*Math.min(.22,Math.hypot(vel.x,vel.y)/(cs*.3)*.22);ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(w);ctx.drawImage(sp,-z/2,-z/2,z,z);ctx.restore()}else{
    sg.length&&snake(ctx,sg,br,sa)}
  ctx.globalAlpha=1;if(joy.on){ctx.save();ctx.globalAlpha=.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.ox,joy.oy,JR,0,7);ctx.fill();ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(joy.ox+joy.dx,joy.oy+joy.dy,JR*.38,0,7);ctx.fill();ctx.restore()}
  if(target&&S.mode==='touch'&&state==='play'){ctx.save();ctx.globalAlpha=.55;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(target.x,target.y,br*1.4,0,7);ctx.stroke();ctx.restore()}
  parts.forEach(q=>{ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,4,0,7);ctx.fill()});
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(30,10,80,.22)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  E.nd.style.transform='rotate('+Math.atan2(gx-ball.x,ball.y-gy)*180/Math.PI+'deg)';const f=tleft/tmax;E.tb.style.width=f*100+'%';E.tb.style.background=f<.2?'#ff4d4d':'#80ed99';const sc=Math.ceil(tleft);if(sc!==E.sc){E.sc=sc;E.tt.textContent=NT()?'∞':'⏱ '+sc+' '+T('s')}E.bar.classList.toggle('low',f<.2&&state==='play'&&!paused);
}
function loop(){if(!inGame)return;const n=performance.now(),dt=Math.min(.05,(n-(loop.l||n))/1000);loop.l=n;if(!paused)step(dt);draw();raf=requestAnimationFrame(loop)}

<script>
/* dokunma kontrolü */
function pt(e){const r=cv.getBoundingClientRect();target={x:e.clientX-r.left,y:e.clientY-r.top-(e.pointerType==='mouse'?0:46)}}
cv.addEventListener('pointerdown',e=>{if(S.mode==='touch'||S.mode==='joy'){cv.setPointerCapture(e.pointerId);if(S.mode==='joy'){const r=cv.getBoundingClientRect();joy={on:true,ox:e.clientX-r.left,oy:e.clientY-r.top,dx:0,dy:0}}else pt(e)}});
cv.addEventListener('pointermove',e=>{if(S.mode==='joy'&&joy.on){const r=cv.getBoundingClientRect();let dx=e.clientX-r.left-joy.ox,dy=e.clientY-r.top-joy.oy;const L=Math.hypot(dx,dy);if(L>JR){dx*=JR/L;dy*=JR/L}joy.dx=dx;joy.dy=dy}else if(target&&S.mode==='touch')pt(e)});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{target=null;joy.on=false}));

upd();coins();

  if(i===0)dlg(t[0],[t[1],t[2]+'.<br>'+mtxt()+(NT()?'':'<br>'+T('secs').replace('#',tmax))],[[T('start'),go]]);
  else if(i===9)dlg(T('boss'),['🔥',T('last')+'<br>'+mtxt()+(NT()?'':'<br>'+T('secs').replace('#',tmax))],[[T('start'),go]]);
  else state='play'}

function hint(){if(state!=='play'||paused)return;if(hintUsed&&!NT()){if(S.coins<3){toast(T('need'));return}S.coins-=3;save();coins()}hintUsed=true;
  const sx=Math.min(C-1,ball.x/cs|0),sy=Math.min(R-1,ball.y/cs|0),pv={},q=[[sx,sy]];pv[sx+','+sy]=0;
  for(let i=0;i<q.length;i++){const[x,y]=q[i];[[0,-1],[1,0],[0,1],[-1,0]].forEach((d,k)=>{const nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>=C||ny>=R||grid[y][x].w[k]||(nx+','+ny) in pv)return;pv[nx+','+ny]=[x,y];q.push([nx,ny])})}

$('#setG').addEventListener('click',()=>{if(state==='play')paused=true});

let wasM=false;document.addEventListener('visibilitychange',()=>{if(document.hidden){wasM=!!mt;clearInterval(mt);mt=0;pause()}else if(wasM)music()});

function snake(c,g,r,a){
  for(let i=g.length-1;i>0;i--){const s=g[i];c.fillStyle=i%2?'#2fbf71':'#7be495';c.strokeStyle='rgba(0,60,30,.5)';c.lineWidth=1.5;c.beginPath();c.arc(s.x,s.y,r*(.86-i/g.length*.5),0,7);c.fill();c.stroke()}

  const q=c.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);q.addColorStop(0,'#a8f5c0');q.addColorStop(1,'#1f9e5a');c.fillStyle=q;c.beginPath();c.arc(0,0,r,0,7);c.fill();
  c.fillStyle='#fff';[-1,1].forEach(s=>{c.beginPath();c.arc(r*.35,s*r*.42,r*.27,0,7);c.fill()});c.fillStyle='#222';[-1,1].forEach(s=>{c.beginPath();c.arc(r*.43,s*r*.42,r*.12,0,7);c.fill()});c.restore()}

$('#tcl').onclick=()=>{click();$('#tu').classList.remove('on')};$('#tok').onclick=()=>{$('#tu').classList.remove('on');$('#play').click()};

<script>
/* Capacitor (mobil paket) köprüsü: tarayıcıda hiçbir şey yapmaz */
(function(){
  const cap=window.Capacitor;if(!cap||!cap.isNativePlatform||!cap.isNativePlatform())return;
  const A=cap.Plugins&&cap.Plugins.App;if(!A)return;
  const on=s=>$(s).classList.contains('on');
